  };
  const STATUS_CLASS = { 'Received': 's-received', 'Assigned': 's-assigned', 'In progress': 's-progress', 'Fixed': 's-fixed', 'Referred to Cobb County': 's-county' };
  const OPEN = ['Received', 'Assigned', 'In progress'];

  try { lang = localStorage.getItem('od-lang') || lang; } catch (e) {}
  let data = null, map = null, layer = null, lastReport = null, lastTrack = null;
  let staffToken = null, staffIssues = [], staffReplies = [];
  try { staffToken = sessionStorage.getItem('od-staff'); } catch (e) {}

  const $ = id => document.getElementById(id);
  const t = k => T[lang][k];
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = n => new Intl.NumberFormat(lang === 'es' ? 'es-US' : 'en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(n || 0);
  const day = iso => iso ? new Date(iso).toLocaleDateString(lang === 'es' ? 'es-US' : 'en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';
  const statusBadge = s => '<span class="badge ' + (STATUS_CLASS[s] || '') + '">' + esc(t('status')[s] || s) + '</span>';
  const title = i => lang === 'es' ? i.titleEs : i.titleEn;
  const matches = (i, q) => {
    const words = q.toLowerCase().split(/\s+/).filter(Boolean);
    if (!words.length) return true;
    const hay = [i.titleEn, i.titleEs, i.categoryEn, i.categoryEs, i.block, i.address, i.department, i.district].join(' ').toLowerCase();
    return words.every(w => hay.indexOf(w) >= 0);
  };

  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-ph]').forEach(el => { el.placeholder = t(el.dataset.ph); });
    $('langBtn').textContent = t('langBtn');
    $('langBtn').setAttribute('aria-label', t('langAria'));
    $('langBtn').setAttribute('lang', lang === 'es' ? 'en' : 'es');
    $('map').setAttribute('aria-label', t('mapLabel'));
    renderHelp(); voiceRender();
    if (data) { fillStatusFilter(); renderIssues(); renderSpending(); }
    if (staffToken) { renderStaff(); renderReplies(); }
    if (lastReport) showReport(lastReport);
    if (lastTrack) showTrack(lastTrack);
  }

  $('langBtn').addEventListener('click', () => {
    lang = lang === 'es' ? 'en' : 'es';
    try { localStorage.setItem('od-lang', lang); } catch (e) {}
    applyLang();
  });

  // Sidebar and tabs
  function setMenu(open) {
    document.querySelector('.side').classList.toggle('open', open);
    $('menuBtn').setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  $('menuBtn').addEventListener('click', () => setMenu($('menuBtn').getAttribute('aria-expanded') !== 'true'));

  function showTab(name) {
    document.querySelectorAll('.panel').forEach(p => { p.hidden = p.id !== name; });
    document.querySelectorAll('[data-tab]').forEach(b => {
      if (b.dataset.tab === name) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    if (name === 'issues' && map) setTimeout(() => map.invalidateSize(), 50);
  }
  document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => {
    showTab(b.dataset.tab); setMenu(false);
    const h = document.querySelector('#' + b.dataset.tab + ' h2');
    (h || $('main')).focus();
  }));
  $('checkFirst').addEventListener('click', () => { showTab('issues'); $('q').focus(); });
  $('goTrack').addEventListener('click', () => { showTab('track'); $('trackId').focus(); });

  // Voice input. Speech recognition turns speech into text, and a parallel recording lets people play it back.
  // The recording stays in the browser. Only the text is sent with the report.
  // Apps Script serves the page inside a Google frame that does not allow the microphone, so in-page voice
  // only works when the page is opened on its own. Otherwise residents use the mic on their phone's keyboard (see dictHint).
  const Speech = window.self === window.top && (window.SpeechRecognition || window.webkitSpeechRecognition);
  const voice = { s: null, clip: null };

  function voiceNote(key) { $('voiceNote').textContent = key ? t(key) : ''; }

  function voiceRender() {
    if (!Speech) return;
    const listening = !!voice.s && !voice.s.stopped;
    const playing = !!voice.clip && !voice.clip.audio.paused;
    $('micBtn').hidden = !!voice.clip;
    $('micBtn').disabled = !!voice.s && voice.s.stopped;
    $('micBtn').setAttribute('aria-pressed', listening ? 'true' : 'false');
    $('micLabel').textContent = t(listening ? 'listening' : 'speak');
    $('voiceBar').hidden = !voice.clip;
    $('playBtn').classList.toggle('playing', playing);
    $('playLabel').textContent = t(playing ? 'pause' : 'play');
  }

  function dropText(text) {
    if (!text) return;
    const d = $('description'), i = d.value.indexOf(text);
    if (i >= 0) d.value = (d.value.slice(0, i).replace(/\s+$/, '') + ' ' + d.value.slice(i + text.length).replace(/^\s+/, '')).trim();
  }
  function stopRecorder(s) { try { if (s.recorder && s.recorder.state !== 'inactive') s.recorder.stop(); } catch (e) {} }
  function releaseMic(s) { if (s.stream) s.stream.getTracks().forEach(tr => tr.stop()); s.stream = null; }

  // Throws away the current recording or clip, and the text it added to the description.
  function discard() {
    const s = voice.s, c = voice.clip;
    voice.s = null; voice.clip = null;
    if (s) { s.dead = true; clearTimeout(s.timer); try { s.rec.abort(); } catch (e) {} stopRecorder(s); releaseMic(s); dropText(s.text); }
    if (c) { c.audio.pause(); URL.revokeObjectURL(c.url); dropText(c.text); }
    voiceNote(''); voiceRender();
  }

  // Called when speech recognition or the audio recorder finishes. The clip is saved once both are done.
  function part(s) {
    if (s.dead || --s.pending > 0) return;
    clearTimeout(s.timer); releaseMic(s);
    voice.s = null;
    if (!s.text) { if (!s.err) voiceNote('noSpeech'); }
    else if (s.chunks.length) {
      const url = URL.createObjectURL(new Blob(s.chunks, { type: s.recorder.mimeType || 'audio/webm' }));
      const audio = new Audio(url);
      ['play', 'pause', 'ended'].forEach(ev => audio.addEventListener(ev, voiceRender));
      voice.clip = { url: url, audio: audio, text: s.text };
    } else voiceNote('noPlayback');
    voiceRender();
  }
  function recDone(s) { if (!s.recFinished) { s.recFinished = true; part(s); } }

  function voiceStart() {
    discard();
    const s = { text: '', chunks: [], stream: null, recorder: null, rec: new Speech(), pending: 1, stopped: false, dead: false, err: false, recFinished: false, timer: null };
    const r = s.rec;
    r.lang = lang === 'es' ? 'es-US' : 'en-US';
    r.continuous = true;
    r.interimResults = false;
    r.onresult = e => {
      if (s.dead) return;
      let piece = '';
      for (let k = e.resultIndex; k < e.results.length; k++) if (e.results[k].isFinal) piece += ' ' + e.results[k][0].transcript;
      piece = piece.trim();
      if (!piece) return;
      s.text = (s.text + ' ' + piece).trim();
      $('description').value = ($('description').value + ' ' + piece).trim();
    };
    r.onerror = e => {
      if (s.dead || e.error === 'aborted') return;
      s.err = true;
      voiceNote(e.error === 'not-allowed' || e.error === 'service-not-allowed' ? 'micDenied' : e.error === 'no-speech' ? 'noSpeech' : 'error');
    };
    r.onend = () => { if (s.dead) return; s.stopped = true; stopRecorder(s); recDone(s); };
    voice.s = s;
    try { r.start(); } catch (e) { voice.s = null; voiceNote('error'); voiceRender(); return; }  // inside the click, as mobile browsers require
    voiceRender();
    // Record the same speech for playback. If the browser won't share the microphone, we still transcribe.
    if (navigator.mediaDevices && window.MediaRecorder) {
      navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
        if (s.dead || s.stopped) { stream.getTracks().forEach(tr => tr.stop()); return; }
        s.stream = stream;
        const rcd = new MediaRecorder(stream);
        s.recorder = rcd; s.pending++;
        rcd.ondataavailable = ev => { if (ev.data && ev.data.size) s.chunks.push(ev.data); };
        rcd.onstop = () => part(s);
        rcd.start();
      }).catch(() => { releaseMic(s); });
    }
  }

  function voiceStop() {
    const s = voice.s;
    if (!s || s.stopped) return;
    s.stopped = true;
    try { s.rec.stop(); } catch (e) {}
    stopRecorder(s);
    voiceRender();  // the button changes right away
    s.timer = setTimeout(() => { try { s.rec.abort(); } catch (e) {} recDone(s); }, 2500);  // if the browser never reports the end
  }

  if (!Speech) {
    // Inside Google's frame the browser's speech service is not available, so Speak records the
    // microphone in the page, converts it to a small WAV file and Gemini writes down what was said.
    // If the browser won't share the microphone, it falls back to the device's recorder or a file.
    const rec = { stream: null, recorder: null, chunks: [], timer: null, startedAt: 0 };
    const micBtn = $('micBtn');
    micBtn.hidden = false;

    function setRecording(on) {
      micBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
      $('micLabel').textContent = t(on ? 'stopRec' : 'speak');
    }
    function stopTracks() { if (rec.stream) rec.stream.getTracks().forEach(tr => tr.stop()); rec.stream = null; }

    // Decodes whatever the browser recorded and re-encodes it as 16 kHz mono WAV, a format Gemini always accepts.
    async function toWav(blob) {
      const AC = window.AudioContext || window.webkitAudioContext;
      const ctx = new AC();
      const buf = await ctx.decodeAudioData(await blob.arrayBuffer());
      ctx.close && ctx.close();
      const rate = 16000, src = buf.getChannelData(0), ratio = buf.sampleRate / rate;
      const n = Math.floor(src.length / ratio), view = new DataView(new ArrayBuffer(44 + n * 2));
      const str = (o, x) => { for (let i = 0; i < x.length; i++) view.setUint8(o + i, x.charCodeAt(i)); };
      str(0, 'RIFF'); view.setUint32(4, 36 + n * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
      view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
      view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
      str(36, 'data'); view.setUint32(40, n * 2, true);
      for (let i = 0; i < n; i++) {
        const v = Math.max(-1, Math.min(1, src[Math.floor(i * ratio)]));
        view.setInt16(44 + i * 2, v < 0 ? v * 0x8000 : v * 0x7fff, true);
      }
      return new Blob([view], { type: 'audio/wav' });
    }

    function sendAudio(blob, name) {
      micBtn.disabled = true; voiceNote('voiceWorking');
      const reader = new FileReader();
      reader.onload = () => {
        google.script.run.withSuccessHandler(r => {
          micBtn.disabled = false;
          const d = $('description');
          d.value = (d.value.trim() + ' ' + r.text).trim();
          d.dispatchEvent(new Event('input'));
          voiceNote('voiceAdded'); d.focus();
        }).withFailureHandler(err => {
          micBtn.disabled = false;
          $('voiceNote').textContent = (err && err.message ? err.message + ' ' : '') + t('dictHint');
        }).transcribeVoice({ name: name, type: blob.type, data: String(reader.result).split(',')[1] });
      };
      reader.onerror = () => { micBtn.disabled = false; voiceNote('error'); };
      reader.readAsDataURL(blob);
    }

    async function startRecording() {
      if (!navigator.mediaDevices || !window.MediaRecorder) throw new Error('unsupported');
      rec.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      rec.chunks = [];
      rec.recorder = new MediaRecorder(rec.stream);
      rec.recorder.ondataavailable = e => { if (e.data && e.data.size) rec.chunks.push(e.data); };
      rec.recorder.onstop = async () => {
        clearTimeout(rec.timer); stopTracks(); setRecording(false);
        const raw = new Blob(rec.chunks, { type: rec.recorder.mimeType || 'audio/webm' });
        if (Date.now() - rec.startedAt < 700 || !raw.size) { voiceNote('noSpeech'); return; }
        let wav = null;
        try { wav = await toWav(raw); } catch (e) { wav = null; }
        sendAudio(wav || raw, wav ? 'voice.wav' : 'voice.webm');
      };
      rec.recorder.start();
      rec.startedAt = Date.now();
      rec.timer = setTimeout(() => { if (rec.recorder.state === 'recording') rec.recorder.stop(); }, 90000);
      setRecording(true); voiceNote('recording');
    }

    micBtn.addEventListener('click', async () => {
      if (rec.recorder && rec.recorder.state === 'recording') { rec.recorder.stop(); return; }
      try { await startRecording(); }
      catch (e) {
        stopTracks(); setRecording(false);
        // If the page's frame blocks the microphone, record in a small window of our own instead.
        if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError') && openRecorderWindow()) return;
        if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) voiceNote('micBlocked');
        // Last resort: the device's recorder (phones) or an audio file.
        $('voiceFile').value = ''; $('voiceFile').click();
      }
    });

    // A small top-level window is not inside Google's frame, so the browser lets it use the microphone.
    // It records and hands the audio back to this page, which converts and sends it as usual.
    window.__odVoiceDone = async (raw) => {
      if (!raw || !raw.size) { voiceNote('noSpeech'); return; }
      let wav = null;
      try { wav = await toWav(raw); } catch (e) { wav = null; }
      sendAudio(wav || raw, wav ? 'voice.wav' : 'voice.webm');
    };
    function openRecorderWindow() {
      const w = window.open('', 'onedoor-voice', 'width=440,height=340');
      if (!w) return false;
      const es = lang === 'es';
      const txt = {
        title: es ? 'Grabar su reporte' : 'Record your report',
        start: es ? 'Empezar a grabar' : 'Start recording',
        stop: es ? 'Parar y agregar' : 'Stop and add',
        hint: es ? 'Hable en español o inglés. Sus palabras aparecerán en el formulario.' : 'Speak in English or Spanish. Your words will appear in the form.',
        rec: es ? 'Grabando…' : 'Recording…',
        denied: es ? 'Se bloqueó el micrófono. Permítalo en la barra de direcciones.' : 'The microphone was blocked. Allow it in the address bar.',
      };
      w.document.open();
      w.document.write('<!doctype html><html lang="' + lang + '"><head><meta charset="utf-8"><title>' + txt.title + '</title>' +
        '<style>body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#f6f0e6;color:#161412;display:flex;flex-direction:column;gap:14px;padding:24px}' +
        'h1{font-size:1.3rem;margin:0}button{font:inherit;font-weight:650;border:0;border-radius:999px;padding:14px 24px;background:#161412;color:#fffaf3;cursor:pointer}' +
        'button:focus-visible{outline:3px solid #161412;outline-offset:2px;box-shadow:0 0 0 2px #ffbf47}button.on{background:#b42318}p{margin:0}</style></head><body>' +
        '<h1>' + txt.title + '</h1><p>' + txt.hint + '</p><button id="b" type="button">' + txt.start + '</button><p id="s" role="status" aria-live="polite"></p></body></html>');
      w.document.close();
      const b = w.document.getElementById('b'), st = w.document.getElementById('s');
      let mr = null, chunks = [], stream = null;
      b.focus();
      b.addEventListener('click', async () => {
        if (mr && mr.state === 'recording') { mr.stop(); return; }
        try {
          stream = await w.navigator.mediaDevices.getUserMedia({ audio: true });
          chunks = [];
          mr = new w.MediaRecorder(stream);
          mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
          mr.onstop = () => {
            stream.getTracks().forEach(tr => tr.stop());
            const blob = new Blob(chunks, { type: mr.mimeType || 'audio/webm' });
            window.__odVoiceDone(blob);
            w.close();
          };
          mr.start();
          b.textContent = txt.stop; b.classList.add('on'); st.textContent = txt.rec;
        } catch (e) { st.textContent = txt.denied; }
      });
      voiceNote('popupHint');
      return true;
    }
    $('voiceFile').addEventListener('change', () => {
      const file = $('voiceFile').files[0];
      if (!file) return;
      if (file.size > 8 * 1024 * 1024) { voiceNote('voiceTooBig'); return; }
      sendAudio(file, file.name);
    });

  // Report form
  function readPhoto(file) {
    return new Promise((resolve, reject) => {
      if (!file) return resolve(null);
      const img = new Image();
      img.onload = () => {
        // Shrink big phone photos so uploads stay fast and under the size limit.
        const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve({ name: file.name, type: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.8).split(',')[1] });
      };
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  }

    const done = () => { clearTimeout(slowTimer); btn.disabled = false; btn.textContent = t('submit'); btn.removeAttribute('aria-busy'); };

    try { photo = await readPhoto($('photo').files[0]); } catch (err) { photo = null; }

  function clearFieldErr(id) {
    const el = $(id), msg = $(id + 'Err');
    el.removeAttribute('aria-invalid');
    if (msg) msg.remove();
    el.setAttribute('aria-describedby', (el.getAttribute('aria-describedby') || '').replace(id + 'Err', '').trim());
  }
  function validateReport() {
    const bad = REQUIRED.filter(([id]) => !$(id).value.trim());
    REQUIRED.forEach(([id]) => clearFieldErr(id));
    const box = $('formErr');
    if (!bad.length) { box.hidden = true; box.innerHTML = ''; return true; }
    bad.forEach(([id, key]) => {
      const el = $(id), msg = document.createElement('p');
      msg.id = id + 'Err'; msg.className = 'field-err'; msg.textContent = t(key);
      el.setAttribute('aria-invalid', 'true');
      el.setAttribute('aria-describedby', ((el.getAttribute('aria-describedby') || '') + ' ' + msg.id).trim());
      (el.closest('.box') || el).insertAdjacentElement('afterend', msg);
    });
    box.innerHTML = '<p><strong>' + esc(t('errTitle')) + '</strong></p><ul>' +
      bad.map(([id, key]) => '<li><a href="#' + id + '">' + esc(t(key)) + '</a></li>').join('') + '</ul>';
    box.hidden = false; box.focus();
    return false;
  }

  function renderMap(list) {
    if (!window.L) return;
    if (!map) {
      // The map is a visual summary of the list below, hidden from screen readers, so it has no focusable controls.
      // OpenStreetMap credit is in the caption under it.
      map = L.map('map', { scrollWheelZoom: false, keyboard: false, zoomControl: false, attributionControl: false }).setView([33.815, -84.575], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);
    }
    if (layer) layer.remove();
    const colors = { 'Received': '#5b6470', 'Assigned': '#0b5cad', 'In progress': '#b07300', 'Fixed': '#0f7b5f', 'Referred to Cobb County': '#6b3fa0' };
    layer = L.layerGroup(list.filter(i => i.lat).map(i => L.circleMarker([i.lat, i.lng], {
      radius: 5 + Math.min(14, i.count * 1.5), color: colors[i.status] || '#333', weight: 2, fillOpacity: 0.35,
    }).bindPopup('<strong>' + esc(title(i)) + '</strong><br>' + i.count + ' ' + esc(t('reports')) + ' · ' + esc(t('status')[i.status] || i.status)))).addTo(map);

    if (!data) return;
    const max = Math.max.apply(null, data.budget.map(b => b.budget).concat([1]));

      '<div><strong>' + esc(b.department) + '</strong> · ' + money(b.budget) + ' <span class="meta">(' + esc(b.type) + ')</span>' +

    const byDept = {};

      const r = byDept[i.department] = byDept[i.department] || { n: 0, fixed: 0, est: 0, spent: 0, sample: false };

    { q: ['Is my voice recording saved?', '¿Se guarda mi grabación de voz?'],
      a: ['The recording stays in your browser so you can play it back. It is not sent with your report, only the text is. Your browser may use its own speech service to turn your voice into text.',
          'La grabación se queda en su navegador para que pueda escucharla. No se envía con su reporte, solo el texto. Es posible que su navegador use su propio servicio de voz para convertir su voz en texto.'] },
    { q: ['Can I report in Spanish?', '¿Puedo reportar en español?'],
      a: ['Yes. Write or speak in English or Spanish, and use the language button to switch the whole site.',
          'Sí. Escriba o hable en español o inglés, y use el botón de idioma para cambiar todo el sitio.'] },
  ];

  function renderHelp() {
    const i = lang === 'es' ? 1 : 0;
    const open = Array.from(document.querySelectorAll('#faqList details')).map(d => d.open);
    $('linkList').innerHTML = LINKS.map(l => '<li><a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(lang === 'es' ? l.es : l.en) +
      '</a><span class="meta">' + esc(lang === 'es' ? l.dEs : l.dEn) + '</span></li>').join('');
    $('faqList').innerHTML = FAQ.map((f, n) => '<details' + (open[n] ? ' open' : '') + '><summary>' + esc(f.q[i]) + '</summary><p>' + esc(f.a[i]) + '</p></details>').join('');
  }

  // Staff
  // Server functions expected: staffLogin(passcode) -> token, staffGetIssues(token) -> issues[],
  // staffUpdateIssue(token, {id, status, note, estCost, spent}) -> updated issue. They throw 'Unauthorized' on a bad token.
  function staffMsg(text, isError) {
    const m = $('staffMsg');
    m.className = 'result' + (isError ? ' error' : '');
    m.textContent = text || '';
  }

  function showStaffState() {
    $('staffLogin').hidden = !!staffToken;
    $('staffArea').hidden = !staffToken;
  }

  function staffSignOut(expired) {
    staffToken = null; staffIssues = []; staffReplies = [];
    try { sessionStorage.removeItem('od-staff'); } catch (e) {}
    setStaffView('issues');
    showStaffState();
    staffMsg(expired ? t('sessionEnded') : '', false);
  }

  function staffFail(err) {
    if (/unauthorized/i.test(err && err.message)) staffSignOut(true);
    else { staffMsg(t('error') + ' (' + (err && err.message) + ')', true); renderStaff(); }
  }

  function loadStaff() {
    google.script.run.withSuccessHandler(list => { staffIssues = list || []; renderStaff(); })
      .withFailureHandler(staffFail).staffGetIssues(staffToken);
    google.script.run.withSuccessHandler(list => { staffReplies = list || []; renderReplies(); })
      .withFailureHandler(staffFail).staffGetReplies(staffToken);
  }

  function setStaffView(v) {
    document.querySelectorAll('[data-sview]').forEach(b => b.setAttribute('aria-pressed', b.dataset.sview === v ? 'true' : 'false'));
    $('sIssues').hidden = v !== 'issues';
    $('sReplies').hidden = v !== 'replies';
  }
  document.querySelectorAll('[data-sview]').forEach(b => b.addEventListener('click', () => setStaffView(b.dataset.sview)));

  function renderReplies() {
    $('replyCount').textContent = staffReplies.length ? '(' + staffReplies.length + ')' : '';
    $('replyList').innerHTML = staffReplies.length ? staffReplies.map(r =>
      '<li class="srow" data-id="' + esc(r.id) + '">' +
      '<p class="meta"><strong>' + esc(t('toLabel')) + ':</strong> ' + esc(r.to) + ' · ' + esc((t('reasons')[r.reason]) || r.reason) +
      ' · ' + esc(r.trackingId) + (r.created ? ' · ' + esc(day(r.created)) : '') + '</p>' +
      '<form class="reply">' +
      '<div class="field"><label>' + esc(t('subjectLabel')) + '<input name="subject" value="' + esc(r.subject) + '"></label></div>' +
      '<div class="field"><label>' + esc(t('messageLabel')) + '<textarea name="body" rows="6">' + esc(r.body) + '</textarea></label></div>' +
      '<button type="submit" class="primary">' + esc(t('approveSend')) + '</button></form></li>'
    ).join('') : '<li class="empty">' + esc(t('noReplies')) + '</li>';
  }

  $('replyList').addEventListener('submit', e => {
    e.preventDefault();
    const li = e.target.closest('.srow'), f = e.target.elements;
    li.classList.add('busy'); staffMsg(t('saving'));
    google.script.run.withSuccessHandler(list => {
      staffReplies = list || []; staffMsg(t('sentOk')); renderReplies();
    }).withFailureHandler(err => { li.classList.remove('busy'); staffFail(err); })
      .staffApproveReply(staffToken, { id: li.dataset.id, subject: f.subject.value, body: f.body.value });
  });

  $('loginForm').addEventListener('submit', e => {
    e.preventDefault();
    const btn = $('loginBtn');
    btn.disabled = true; staffMsg('');
    google.script.run.withSuccessHandler(token => {
      btn.disabled = false;
      if (!token) { staffMsg(t('badPass'), true); return; }
      staffToken = token; $('pass').value = '';
      try { sessionStorage.setItem('od-staff', token); } catch (err) {}
      showStaffState(); loadStaff();
    }).withFailureHandler(() => { btn.disabled = false; staffMsg(t('badPass'), true); }).staffLogin($('pass').value);
  });
  $('logoutBtn').addEventListener('click', () => staffSignOut(false));
  $('sq').addEventListener('input', renderStaff);
  $('sFilter').addEventListener('change', renderStaff);

  function renderStaff() {
    const q = $('sq').value.trim(), f = $('sFilter').value;
    const list = staffIssues
      .filter(i => (f === 'all' || (f === 'open' ? OPEN.indexOf(i.status) >= 0 : i.status === f)) && matches(i, q))
      .sort((a, b) => b.count - a.count);
    $('staffList').innerHTML = list.length ? list.map(i => {
      const canStart = i.status === 'Received' || i.status === 'Assigned';
      const note = lang === 'es' ? i.noteEs : i.noteEn;
      return '<li class="srow" data-id="' + esc(i.id) + '"><div class="shead"><div>' +
        '<h3>' + esc(title(i)) + '</h3>' +
        '<p class="meta">' + statusBadge(i.status) + i.count + ' ' + esc(i.count === 1 ? t('report1') : t('reports')) + ' · ' + esc(i.department) +
        (i.district ? ' · ' + esc(t('district')) + ' ' + esc(i.district) : '') + (i.block ? ' · ' + esc(i.block) : '') + '</p></div>' +
        '<div class="actions">' +
        (canStart ? '<button type="button" class="act go" data-act="start">' + esc(t('startWork')) + '</button>' : '') +
        (i.status !== 'Fixed' ? '<button type="button" class="act go" data-act="fix">' + esc(t('markFixed')) + '</button>' : '') +
        '<button type="button" class="act" data-act="edit" aria-expanded="false">' + esc(t('edit')) + '</button></div></div>' +
        '<form class="sedit" hidden>' +
        '<div class="field"><label>' + esc(t('statusLabel')) + '<select name="status">' +
        Object.keys(T.en.status).map(s => '<option value="' + esc(s) + '"' + (s === i.status ? ' selected' : '') + '>' + esc(t('status')[s]) + '</option>').join('') + '</select></label></div>' +
        '<div class="field"><label>' + esc(t('noteLabel')) + '<textarea name="note" rows="2">' + esc(note || '') + '</textarea></label></div>' +
        '<div class="row"><div class="field"><label>' + esc(t('estLabel')) + '<input name="estCost" type="number" min="0" step="1" value="' + esc(i.estCost || '') + '"></label></div>' +
        '<div class="field"><label>' + esc(t('spentLabel')) + '<input name="spent" type="number" min="0" step="1" value="' + esc(i.spent || '') + '"></label></div></div>' +
        '<button type="submit" class="primary">' + esc(t('save')) + '</button></form></li>';
    }).join('') : '<li class="empty">' + esc(t('noIssues')) + '</li>';
  }

  function staffSend(li, payload) {
    li.classList.add('busy'); staffMsg(t('saving'));
    google.script.run.withSuccessHandler(u => {
      const idx = staffIssues.findIndex(x => String(x.id) === String(payload.id));
      if (idx >= 0) staffIssues[idx] = u && u.id != null ? u : Object.assign(staffIssues[idx], payload);
      staffMsg(t('saved')); renderStaff(); loadData();
    }).withFailureHandler(staffFail).staffUpdateIssue(staffToken, payload);
  }

  $('staffList').addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const li = b.closest('.srow'), id = li.dataset.id;
    if (b.dataset.act === 'edit') {
      const form = li.querySelector('.sedit');
      form.hidden = !form.hidden;
      b.setAttribute('aria-expanded', form.hidden ? 'false' : 'true');
    } else staffSend(li, { id: id, status: b.dataset.act === 'start' ? 'In progress' : 'Fixed' });
  });
  $('staffList').addEventListener('submit', e => {
    e.preventDefault();
    const li = e.target.closest('.srow'), f = e.target.elements;
    staffSend(li, {
      id: li.dataset.id, status: f.status.value, note: f.note.value.trim(),
      estCost: Number(f.estCost.value) || 0, spent: Number(f.spent.value) || 0,
    });
  });

  // Start
  applyLang();
  showStaffState();
  if (staffToken) loadStaff();
  showTab(document.body.dataset.page && $(document.body.dataset.page) ? document.body.dataset.page : 'report');
  loadData();
  if (document.body.dataset.trackId) {
    $('trackId').value = document.body.dataset.trackId;
    $('trackForm').requestSubmit();
  }
</script>
